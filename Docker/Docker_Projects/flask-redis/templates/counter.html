<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visitor Counter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">🐳 Ma'aaz Khan</div>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/stats">Stats</a></li>
        <li><a href="/health">Health</a></li>
    </ul>
</nav>

<div class="container">

    <section class="hero">

        <span class="badge">Visitor Counter</span>

        <h1>👋 Welcome!</h1>

        <h2 style="font-size:70px; margin:40px 0; color:#38bdf8;">
            {{ visits }}
        </h2>

        <p class="subtitle">
            This page has been visited <strong>{{ visits }}</strong> times.
        </p>

        <div class="hero-actions">
            <a href="/count" class="btn primary">Refresh Counter</a>
            <a href="/reset" class="btn secondary">Reset Counter</a>
            <a href="/" class="btn secondary">Back Home</a>
        </div>

    </section>

</div>

</body>
</html>
